# Codemagic: iOS 앱(탑신병자)을 빌드해 TestFlight에 올린다 (SPEC 6-63)
#           Android App Bundle(.aab)을 만든다 — 업로드는 Play Console에서 직접 (SPEC 6-69)
#
# - 실행은 Codemagic 화면의 "Start new build"로만 한다(무료 분량 500분/월 절약).
#   push·PR 때 자동으로 돌리려면 workflow 안에 아래처럼 triggering을 추가한다.
#     triggering:
#       events: [push]
#       branch_patterns:
#         - pattern: main
#           include: true
# - 비밀 값은 저장소에 두지 않는다. 아래 groups의 이름만 참조하고 값은 Codemagic 화면에서 넣는다.
#     web_env          : VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_TURNSTILE_SITE_KEY
#     ios_signing_key  : CERTIFICATE_PRIVATE_KEY (Secret, 배포 인증서용 RSA 개인키)
# - Android 업로드 키스토어는 Codemagic의 Code signing identities에 참조 이름 topsinbyeongja_upload로 올려 둔다
#   (key alias: upload). 빌드 때 CM_KEYSTORE_PATH·CM_KEYSTORE_PASSWORD·CM_KEY_ALIAS·CM_KEY_PASSWORD로 들어온다.
# - App Store Connect API 키는 Codemagic의 Developer Portal 통합 "Codemagic"을 쓴다.
# - Apple 팀 ID(참고): MY42TLAPWL. 서명 설정은 프로비저닝 프로파일에서 가져오므로 여기서 직접 쓰지 않는다.

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Codemagic
    environment:
      xcode: 26.6
      node: 22
      groups:
        - web_env
        - ios_signing_key
      vars:
        BUNDLE_ID: com.topsinbyeongja.app
        APP_STORE_APPLE_ID: "6835358085"
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: 환경 변수 확인 (값은 출력하지 않음)
        script: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_TURNSTILE_SITE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "$(printenv "$name")" ]; then
              echo "환경 변수 $name 이(가) 비어 있습니다. Codemagic 화면의 web_env / ios_signing_key 그룹을 확인하세요."
              missing=1
            fi
          done
          exit $missing

      - name: 의존성 설치
        script: npm ci

      - name: 웹 빌드
        script: npm run build

      - name: Capacitor iOS 동기화
        script: npx cap sync ios

      - name: 코드 서명 준비 (인증서·프로파일 없으면 자동 생성)
        script: |
          keychain initialize
          # CERTIFICATE_PRIVATE_KEY 환경 변수의 개인키로 App Store 배포 인증서를 찾거나 만들고,
          # 이 번들 ID의 App Store 프로비저닝 프로파일을 찾거나 만든다.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"

      - name: 빌드 번호 올리기
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 | tr -d '[:space:]' || true)
          case "$LATEST" in
            ''|*[!0-9]*)
              echo "TestFlight 최신 빌드 번호를 가져오지 못했습니다(첫 업로드면 정상). Codemagic 빌드 번호를 씁니다."
              LATEST=0
              ;;
          esac
          NEXT=$((LATEST + 1))
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then
            NEXT=$BUILD_NUMBER
          fi
          echo "빌드 번호: $NEXT (TestFlight 최신: $LATEST, Codemagic: ${BUILD_NUMBER:-없음})"
          # Info.plist의 CFBundleVersion은 $(CURRENT_PROJECT_VERSION)을 따른다. 빌드 머신 안에서만 바꾼다.
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $NEXT;/g" "$XCODE_PROJECT/project.pbxproj"
          COUNT=$(grep -c "CURRENT_PROJECT_VERSION = $NEXT;" "$XCODE_PROJECT/project.pbxproj" || true)
          if [ "$COUNT" -ne 2 ]; then
            echo "CURRENT_PROJECT_VERSION 두 줄(Debug·Release)을 바꾸지 못했습니다: $COUNT 줄"
            exit 1
          fi

      - name: 아카이브 및 .ipa 만들기
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

      # 진단(SPEC 6-64): 서명된 앱과 임베디드 프로비저닝 프로필에 Sign in with Apple 권한이 들어갔는지 로그로만 보여 준다.
      # 정보 출력만 한다 — 실패해도 빌드·업로드는 계속된다(ignore_failure + 항상 exit 0).
      # 프로필은 이름·팀·만료일·권한만 출력한다(인증서 데이터는 출력하지 않음).
      - name: 진단 - 서명된 앱 권한 확인 (applesignin)
        ignore_failure: true
        script: |
          APP=$(find build/ios/xcarchive -maxdepth 5 -path "*Products/Applications/*.app" -type d 2>/dev/null | head -n 1)
          if [ -z "$APP" ]; then
            echo "[진단] xcarchive 안에서 .app을 찾지 못했습니다."
            exit 0
          fi
          echo "[진단] 앱: $APP"

          echo "== 서명된 앱의 entitlements =="
          ENT=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -convert xml1 -o - - 2>/dev/null || true)
          if [ -z "$ENT" ]; then
            ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          fi
          echo "$ENT"
          if echo "$ENT" | grep -q "com.apple.developer.applesignin"; then
            echo "[진단] 서명된 앱: applesignin 있음"
          else
            echo "[진단] 서명된 앱: applesignin 없음"
          fi

          echo "== 임베디드 프로비저닝 프로필 (이름·팀·만료·권한만) =="
          PROFILE="$CM_BUILD_DIR/diag_profile.plist"
          if security cms -D -i "$APP/embedded.mobileprovision" > "$PROFILE" 2>/dev/null; then
            for key in Name TeamIdentifier ExpirationDate Entitlements; do
              echo "-- $key"
              /usr/libexec/PlistBuddy -c "Print :$key" "$PROFILE" 2>/dev/null || echo "(없음)"
            done
            if /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin" "$PROFILE" >/dev/null 2>&1; then
              echo "[진단] 프로비저닝 프로필: applesignin 있음"
            else
              echo "[진단] 프로비저닝 프로필: applesignin 없음"
            fi
          else
            echo "[진단] embedded.mobileprovision을 읽지 못했습니다."
          fi
          rm -f "$PROFILE"
          exit 0

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # false: 업로드만 한다. 내부 테스터는 베타 심사 없이 설치할 수 있다.
        # 외부 테스터에게 보내려면 true로 바꾸고 beta_groups를 넣는다.
        submit_to_testflight: false

  android-aab:
    name: Android AAB
    # 수동 실행 전용 (triggering 없음). Google Play 업로드는 하지 않는다 — artifacts의 .aab를 받아 Play Console에 직접 올린다.
    # 무료 플랜은 mac_mini_m2만 쓸 수 있다(linux_x2는 "selected instance type is not available with the current billing plan"). 그래서 macOS(BSD 도구) 기준으로 쓴다.
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      # Capacitor 8 안드로이드(capacitor.build.gradle·플러그인)가 JavaVersion.VERSION_21로 컴파일하므로 JDK 21이 필요하다(17이면 실패).
      java: 21
      groups:
        - web_env
      android_signing:
        - topsinbyeongja_upload
    scripts:
      - name: 환경 변수 확인 (값은 출력하지 않음)
        script: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_TURNSTILE_SITE_KEY CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then
              echo "환경 변수 $name 이(가) 비어 있습니다. Codemagic 화면의 web_env 그룹 / 키스토어 topsinbyeongja_upload를 확인하세요."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ] && [ ! -f "$CM_KEYSTORE_PATH" ]; then
            echo "키스토어 파일이 없습니다(CM_KEYSTORE_PATH)."
            missing=1
          fi
          exit $missing

      - name: Android SDK 위치 지정
        script: |
          # 맥 이미지: ANDROID_SDK_ROOT가 비어 있으면 ANDROID_HOME, 그래도 없으면 ~/Library/Android/sdk
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "Android SDK 폴더가 없습니다: $SDK"
            exit 1
          fi
          echo "sdk.dir=$SDK" > "$CM_BUILD_DIR/android/local.properties"
          echo "Android SDK: $SDK"

      - name: 의존성 설치
        script: npm ci

      - name: 웹 빌드
        script: npm run build

      - name: Capacitor Android 동기화
        script: npx cap sync android

      - name: versionCode 올리기
        script: |
          GRADLE_FILE=android/app/build.gradle
          CURRENT=$(sed -n -E 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+)[[:space:]]*$/\1/p' "$GRADLE_FILE")
          case "$CURRENT" in
            ''|*[!0-9]*) echo "build.gradle에서 versionCode를 찾지 못했습니다."; exit 1 ;;
          esac
          # Codemagic 빌드 번호(이 워크플로에서 실행할 때마다 1씩 오름). 저장소 값보다 작으면 저장소 값 + 1.
          NEXT=${BUILD_NUMBER:-0}
          if [ "$NEXT" -le "$CURRENT" ]; then
            NEXT=$((CURRENT + 1))
          fi
          echo "versionCode: $NEXT (저장소: $CURRENT, Codemagic: ${BUILD_NUMBER:-없음})"
          # 빌드 머신 안에서만 바꾼다 (저장소에는 커밋하지 않음).
          # macOS(BSD) sed는 -i 뒤에 확장자 인자가 꼭 필요하다 — .bak을 붙였다가 지우면 GNU·BSD 모두 동작
          sed -i.bak -E "s/^([[:space:]]*versionCode[[:space:]]+)[0-9]+[[:space:]]*$/\1$NEXT/" "$GRADLE_FILE"
          rm -f "$GRADLE_FILE.bak"
          COUNT=$(grep -c -E "^[[:space:]]*versionCode[[:space:]]+$NEXT[[:space:]]*$" "$GRADLE_FILE" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "versionCode를 바꾸지 못했습니다: $COUNT 줄"
            exit 1
          fi

      - name: AAB 만들기 (bundleRelease)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: 서명 확인 (인증서 내용은 출력하지 않음)
        script: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB" ]; then
            echo "app-release.aab가 없습니다."
            exit 1
          fi
          if unzip -l "$AAB" | grep -q -E 'META-INF/[^/]+\.(RSA|EC|DSA)$'; then
            echo "서명된 AAB입니다: $AAB ($(du -h "$AAB" | cut -f1))"
          else
            echo "AAB에 서명이 없습니다. build.gradle의 release 서명 설정을 확인하세요."
            exit 1
          fi

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
