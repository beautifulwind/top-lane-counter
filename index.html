<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#00a495" />
    <meta name="description" content="탑신병자 - 롤 탑 카운터. 상대 탑 라이너를 이기는 카운터 챔피언과 라인전 공략을 모은 참여형 위키" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!-- crossorigin: Codespace 비공개 포트에서 manifest 요청에도 로그인 쿠키를 실어 CORS 오류를 막는다 -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <title>탑신병자 - 롤 탑 카운터</title>
  </head>
  <body>
    <noscript>이 사이트를 보려면 JavaScript를 켜 주세요.</noscript>
    <!-- 앱이 뜨기 전 문구. React가 시작되면 사라진다. 15초 넘게 남아 있으면 안내로 바꾼다. -->
    <div id="root"><p style="padding:48px 16px;text-align:center;color:#6c757d">불러오는 중…</p></div>
    <script>
      setTimeout(function () {
        var p = document.querySelector('#root > p');
        if (p && p.textContent === '불러오는 중…') {
          p.innerHTML = '사이트를 불러오지 못했어요.<br><a href="" style="color:#008275">새로고침</a>';
        }
      }, 15000);
    </script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
