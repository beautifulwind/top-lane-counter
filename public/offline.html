<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>오프라인 - 탑신병자</title>
  <!-- 색은 src/styles/tokens.css 값과 같다 (src/test/pwa.test.js가 --bg·--brand 일치를 확인) -->
  <style>
    html, body { margin: 0; background: #0a0a0a; color: #f5f5f5; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
      font-family: Pretendard, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; text-align: center; }
    main { max-width: 360px; }
    h1 { margin: 0 0 12px; font-size: 20px; }
    p { margin: 0 0 24px; color: #a1a1a1; font-size: 16px; }
    button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #fe9a00; color: #000000; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>인터넷에 연결되어 있지 않습니다</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
